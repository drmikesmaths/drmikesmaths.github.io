<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBT Statistics Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one centred test card on a pale blue page, with a sticky navy timer bar */
:root{
  --navy:#0B1259; --pale:#EAF2FB; --card:#FFFFFF; --ink:#1A2140; --muted:#5A6385;
  --line:#C9D6EA; --good:#1E7B3A; --good-bg:#E5F4EA; --bad:#B3261E; --bad-bg:#FBE9E7;
  --btn-fg:#FFFFFF; --on-bad:#FFFFFF; --pick-bg:#E3EAF8;
  --font:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#9FB4FF; --pale:#0E1330; --card:#171D3D; --ink:#E6EAF7; --muted:#A3ABC9;
  --line:#2C3563; --good:#7FD69A; --good-bg:#16301F; --bad:#FF9C92; --bad-bg:#3A1A18;
  --btn-fg:#0B1259; --on-bad:#3A1A18; --pick-bg:#232C5A; color-scheme:dark } }
:root[data-theme="dark"]{
  --navy:#9FB4FF; --pale:#0E1330; --card:#171D3D; --ink:#E6EAF7; --muted:#A3ABC9;
  --line:#2C3563; --good:#7FD69A; --good-bg:#16301F; --bad:#FF9C92; --bad-bg:#3A1A18;
  --btn-fg:#0B1259; --on-bad:#3A1A18; --pick-bg:#232C5A; color-scheme:dark }
body{ margin:0; background:var(--pale); color:var(--ink); font-family:var(--font); font-size:18px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:24px; }
.wrap{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
.brand{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; color:var(--navy); }
.brand b{ font-size:20px; letter-spacing:.02em; }
.brand span{ font-size:15px; color:var(--muted); }
.timerbar{ position:sticky; top:calc(8px + env(safe-area-inset-top,0px)); z-index:5; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--navy); color:var(--btn-fg); border-radius:12px; padding:10px 18px; font-variant-numeric:tabular-nums; }
.timerbar strong{ font-size:26px; letter-spacing:.03em; margin-left:6px; }
.timerbar.low{ background:var(--bad); color:var(--on-bad); }
.warnmsg{ background:var(--bad-bg); color:var(--bad); border:2px solid var(--bad); border-radius:10px; padding:10px 16px; font-weight:700; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; display:flex; flex-direction:column; gap:18px; }
h1{ margin:0; color:var(--navy); font-size:30px; line-height:1.2; text-wrap:balance; }
.rules{ margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px; }
.qnum{ font-size:15px; color:var(--muted); font-weight:600; }
.q-text{ overflow-x:auto; overflow-y:hidden; }
.q-text p{ margin:0 0 10px; } .q-text p:last-child{ margin:0; }
.q-img{ display:flex; justify-content:center; }
.q-img button.zoom{ border:0; background:none; padding:0; cursor:zoom-in; display:block; max-width:100%; }
.q-img img{ background:#FFFFFF; padding:6px; border-radius:6px; max-width:100%; height:auto; display:block; }
.zoom-hint{ text-align:center; font-size:15px; color:var(--muted); margin-top:-10px; }
.answers{ display:flex; flex-direction:column; gap:10px; }
.ans{ display:flex; align-items:center; gap:12px; padding:12px 16px; border:2px solid var(--line); border-radius:10px; cursor:pointer; }
.ans:hover{ border-color:var(--navy); }
.ans.picked{ border-color:var(--navy); background:var(--pick-bg); }
.ans.correct{ border-color:var(--good); background:var(--good-bg); }
.ans.wrong{ border-color:var(--bad); background:var(--bad-bg); }
.ans.locked{ cursor:default; }
.ans input{ width:20px; height:20px; accent-color:var(--navy); flex:none; }
.ans > span{ min-width:0; overflow-x:auto; overflow-y:hidden; }
.dots{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--navy); background:transparent; padding:0; cursor:pointer; }
.dot.done{ background:var(--line); } .dot.now{ background:var(--navy); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.row .spacer{ flex:1; }
button.btn{ font:inherit; font-weight:700; font-size:16px; padding:10px 22px; border-radius:30px; border:2px solid var(--navy); background:var(--navy); color:var(--btn-fg); cursor:pointer; }
button.btn.ghost{ background:transparent; color:var(--navy); }
button.btn:disabled{ opacity:.4; cursor:default; }
button:focus-visible{ outline:3px solid var(--navy); outline-offset:3px; }
.confirm{ border:2px solid var(--navy); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--pick-bg); }
.confirm p{ margin:0; font-weight:600; }
.score{ font-size:40px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
.bar{ height:14px; background:var(--line); border-radius:7px; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--navy); }
.review{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
.rv{ font:inherit; font-size:16px; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
.rv:hover{ border-color:var(--navy); }
.pill{ font-size:13px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.pill.ok{ color:var(--good); background:var(--good-bg); }
.pill.no{ color:var(--bad); background:var(--bad-bg); }
.pill.skip{ color:var(--muted); background:var(--pale); }
.small{ font-size:15px; color:var(--muted); margin:0; }
.lightbox{ position:fixed; inset:0; z-index:50; background:rgba(10,14,40,.94); display:flex; flex-direction:column; align-items:center; gap:12px; padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); }
.lightbox .close{ align-self:flex-end; background:#FFFFFF; color:#0B1259; border-color:#FFFFFF; }
.lb-scroll{ overflow:auto; max-width:100%; flex:1; min-height:0; }
.lb-scroll img{ display:block; max-width:none; height:auto; background:#FFFFFF; border-radius:6px; padding:8px; }
.lb-tip{ color:#FFFFFF; font-size:15px; text-align:center; }
@media (max-width:480px){ .card{ padding:20px 16px; } .timerbar strong{ font-size:22px; } }
mjx-container{ font-size:105% !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Dr Mike's Maths</b><span>NBT MAT · 15-minute test</span></div>
  <div class="timerbar" id="bar" hidden><span>Time left <strong id="clock">--:--</strong></span><span id="count"></span></div>
  <div class="warnmsg" id="warn" role="alert" hidden>5 minutes left. Check any questions you have not answered yet.</div>
  <main class="card" id="app" aria-live="polite"></main>
  <p class="small">Each question has four answers, but only one is correct.</p>
</div>

function loadSaved(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.ans) && s.ans.length === N && !s.done) return s; } catch (e) {} return null; }

const pad = n => String(n).padStart(2, '0');
function fmt(ms){ const t = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s); }
const answered = () => st.ans.filter(x => x !== null).length;

function typeset(){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([app]).catch(() => {}); }

function intro(){
  bar.hidden = true; warn.hidden = true;
  app.innerHTML = `<h1>${QUIZ.title}</h1>
    <p>This test has ${N} questions and you have <b>${QUIZ.label}</b> to complete it.</p>
    <ul class="rules">
      <li>Each question has four answers, but only one is correct.</li>
      <li>You can move between the questions and change your answers until the time is up.</li>
      <li>The timer starts when you press <b>Start Test</b>. When the time runs out, the test ends and your answers are marked.</li>
      <li>At the end you will see your score and which questions you got wrong. The Test Review lessons in the NBT MAT course show how each question is solved.</li>
    </ul>
    <div class="row"><button class="btn" id="start">Start Test</button></div>`;
  document.getElementById('start').onclick = () => { st = { start: Date.now(), end: Date.now() + QUIZ.minutes * 60000, ans: Array(N).fill(null), warned: false, done: false }; save(); run(); };
}

function run(){
  bar.hidden = false; warn.hidden = !st.warned;
  clearInterval(tick); tick = setInterval(update, 500); update();
  if (!st.done) question();
}

function update(){
  const left = st.end - Date.now();
  clock.textContent = fmt(left);
  count.textContent = 'Answered ' + answered() + ' of ' + N;
  bar.classList.toggle('low', left <= 5 * 60000);
  if (left <= 5 * 60000 && !st.warned){ st.warned = true; save(); warn.hidden = false; }
  if (left <= 0) finish(true);
}

function question(){
  const Q = QUIZ.questions[cur];
  const dots = QUIZ.questions.map((_, i) => `<button class="dot ${i === cur ? 'now' : (st.ans[i] !== null ? 'done' : '')}" data-i="${i}" aria-label="Question ${i + 1}${st.ans[i] !== null ? ', answered' : ''}"></button>`).join('');
  const answers = Q.a.map((t, i) => `<label class="ans ${st.ans[cur] === i ? 'picked' : ''}"><input type="radio" name="a" id="q${cur}a${i}" value="${i}" ${st.ans[cur] === i ? 'checked' : ''}><span>${t}</span></label>`).join('');
  app.innerHTML = `<div class="dots">${dots}</div>
    <div class="qnum">Question ${cur + 1} of ${N}</div>
    ${Q.img ? `<div class="q-img"><button type="button" class="zoom" aria-label="Enlarge the picture"><img src="${Q.img}" alt="Diagram for this question"></button></div><div class="zoom-hint">Tap the picture to enlarge it</div>` : ''}
    <div class="q-text">${Q.q}</div>
    <div class="answers">${answers}</div>
    <div class="row">
      <button class="btn ghost" id="prev" ${cur === 0 ? 'disabled' : ''}>Previous</button>
      ${cur < N - 1 ? `<button class="btn" id="next">Next</button>` : ''}
      <span class="spacer"></span>
      <button class="btn ${cur === N - 1 ? '' : 'ghost'}" id="finish">Finish Test</button>
    </div>
    <div id="confirm"></div>`;
  app.querySelectorAll('input[name=a]').forEach(r => r.onchange = () => {
    st.ans[cur] = +r.value; save(); update();
    app.querySelectorAll('.ans').forEach((l, i) => l.classList.toggle('picked', i === st.ans[cur]));
    const d = app.querySelectorAll('.dot')[cur]; d.setAttribute('aria-label', 'Question ' + (cur + 1) + ', answered');
  });
  app.querySelectorAll('.dot').forEach(d => d.onclick = () => { cur = +d.dataset.i; question(); });
  app.querySelectorAll('.zoom').forEach(b => b.onclick = () => openZoom(b.querySelector('img')));
  document.getElementById('prev').onclick = () => { cur--; question(); };
  const nx = document.getElementById('next'); if (nx) nx.onclick = () => { cur++; question(); };
  document.getElementById('finish').onclick = askFinish;
  typeset();
}

function askFinish(){
  const box = document.getElementById('confirm'); const a = answered();
  box.innerHTML = `<div class="confirm"><p>You have answered ${a} of ${N} questions${a < N ? ' and still have time left' : ''}. Do you want to finish the test now?</p>
    <div class="row"><button class="btn" id="yes">Yes, finish now</button><button class="btn ghost" id="no">Keep working</button></div></div>`;
  document.getElementById('yes').onclick = () => finish(false);
  document.getElementById('no').onclick = () => { box.innerHTML = ''; };
  document.getElementById('yes').focus();
}

function finish(timeUp){
  if (st.done) return;
  clearInterval(tick); st.done = true; st.finished = Math.min(Date.now(), st.end); st.timeUp = timeUp;
  bar.hidden = true; warn.hidden = true; clearSave();
  results();
}

function results(){
  const score = QUIZ.questions.reduce((s, Q, i) => s + (st.ans[i] === Q.c ? 1 : 0), 0);
  const pct = Math.round(score / N * 100);
  const rows = QUIZ.questions.map((Q, i) => { const a = st.ans[i]; const [cls, txt] = a === null ? ['skip', 'Not answered'] : a === Q.c ? ['ok', 'Correct'] : ['no', 'Not correct'];
    return `<button class="rv" data-i="${i}"><span>Question ${i + 1}</span><span class="pill ${cls}">${txt}</span></button>`; }).join('');
  app.innerHTML = `<h1>${st.timeUp ? 'Time is up' : 'Test finished'}</h1>
    <div class="score">${score} / ${N}</div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <p>You scored ${pct}%. You answered ${answered()} of ${N} questions in ${fmt(st.finished - st.start)}.</p>
    <p class="small">Tap a question to look at it again with your answer.</p>
    <div class="review">${rows}</div>
    <p>The Test Review lessons in the NBT MAT course show how each question is solved.</p>`;
  app.querySelectorAll('.rv').forEach(b => b.onclick = () => reviewQ(+b.dataset.i));
}

function reviewQ(i){
  const Q = QUIZ.questions[i], a = st.ans[i];
  const answers = Q.a.map((t, k) => { let cls = 'ans locked'; if (k === a) cls += (a === Q.c ? ' correct' : ' wrong');
    return `<label class="${cls}"><input type="radio" disabled ${k === a ? 'checked' : ''}><span>${t}</span></label>`; }).join('');
  const msg = a === null ? '<p class="small">You did not answer this question.</p>' : a === Q.c ? '<p class="small" style="color:var(--good);font-weight:700">Your answer is correct.</p>' : '<p class="small" style="color:var(--bad);font-weight:700">Your answer is not correct.</p>';
  app.innerHTML = `<div class="qnum">Question ${i + 1} of ${N}</div>
    ${Q.img ? `<div class="q-img"><button type="button" class="zoom" aria-label="Enlarge the picture"><img src="${Q.img}" alt="Diagram for this question"></button></div><div class="zoom-hint">Tap the picture to enlarge it</div>` : ''}
    <div class="q-text">${Q.q}</div>
    <div class="answers">${answers}</div>
    ${msg}
    <div class="row"><button class="btn ghost" id="pq" ${i === 0 ? 'disabled' : ''}>Previous</button><button class="btn ghost" id="nq" ${i === N - 1 ? 'disabled' : ''}>Next</button><span class="spacer"></span><button class="btn" id="back">Back to results</button></div>`;
  app.querySelectorAll('.zoom').forEach(b => b.onclick = () => openZoom(b.querySelector('img')));
  document.getElementById('pq').onclick = () => reviewQ(i - 1);
  document.getElementById('nq').onclick = () => reviewQ(i + 1);
  document.getElementById('back').onclick = results;
  typeset();
}

function openZoom(src){
  const d = document.createElement('div'); d.className = 'lightbox'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Enlarged picture');
  d.innerHTML = '<button type="button" class="btn close">Close</button><div class="lb-scroll"><img alt="Enlarged picture"></div><div class="lb-tip" hidden>Slide the picture sideways to see all of it</div>';
  const im = d.querySelector('.lb-scroll img'); im.src = src.src;
  const nat = src.naturalWidth || 900;
  const fit = () => { const room = window.innerWidth - 48; im.style.width = Math.max(nat, Math.min(room, nat * 2)) + 'px'; d.querySelector('.lb-tip').hidden = !(im.offsetWidth > d.querySelector('.lb-scroll').clientWidth + 2); };
  const shut = () => { d.remove(); document.removeEventListener('keydown', esc); window.removeEventListener('resize', fit); };
  const esc = e => { if (e.key === 'Escape') shut(); };
  d.querySelector('.close').onclick = shut; d.onclick = e => { if (e.target === d) shut(); };
  document.addEventListener('keydown', esc); window.addEventListener('resize', fit);
  document.body.appendChild(d); fit(); d.querySelector('.close').focus();
}

/* If a learner reloads the page during a test, carry on where they left off with the same clock */
st = loadSaved();
if (st) { if (Date.now() >= st.end) { st.done = false; finish(true); } else run(); } else intro();
</script>
</body>
</html>
